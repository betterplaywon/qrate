# CI 게이트: 타입체크·린트·테스트·빌드·브라우저 E2E가 전부 통과해야 머지할 수 있다.
#
# 주의: 이 파일만으로는 "게이트"가 아니다. 워크플로우는 결과를 보고할 뿐이고,
# 실제 강제는 GitHub 저장소 Settings → Branches → Branch protection rule에서
# "Require status checks to pass before merging"에 아래 verify 잡을 등록해야 완성된다.
# (면접 질문 1번 — docs/interview/week1-infra.md)
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 이 워크플로우는 저장소를 읽기만 한다. 권한을 파일에 적어 두면 레포 기본 설정이 바뀌어도 토큰이 쓰기 권한을 얻지 않는다.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 저장소 계약 테스트(apps/server/test/repo-postgres.test.ts)용 Postgres. 로컬의 docker compose db(qrate_test)와 같은 역할.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qrate
          POSTGRES_PASSWORD: qrate
          POSTGRES_DB: qrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 마이그레이션 적용(db:deploy)과 테스트가 같은 전용 DB를 본다. E2E 서버는 QRATE_REPO=memory로 고정이라 이 값을 쓰지 않는다.
      DATABASE_URL: postgresql://qrate:qrate@localhost:5432/qrate_test
      QRATE_TEST_DATABASE_URL: postgresql://qrate:qrate@localhost:5432/qrate_test
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다. 태그는 액션 저장소 쪽에서 다른 커밋으로 옮길 수 있고, 옮겨진 코드가 이 잡의
      # 테스트 결과(머지 필수 체크)를 바꿀 수 있다. 버전을 올릴 때는 새 릴리스의 커밋 SHA로 바꾸고 주석의 버전도 고친다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 토큰을 .git/config에 남기지 않는다. 뒤의 pnpm install이 실행하는 의존성 스크립트가 읽을 수 없게.
          persist-credentials: false

      # packageManager 필드(pnpm@10.x)를 읽어 동일한 pnpm 버전을 설치한다.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm # pnpm 스토어 캐시 — 무엇이 캐시되는지는 면접 질문 5번

      # --frozen-lockfile: 락파일과 package.json이 어긋나면 설치를 실패시킨다.
      # CI에서 "내 로컬과 다른 의존성"이 몰래 설치되는 사고를 차단.
      # 서버 postinstall이 prisma generate를 돌린다(생성 코드는 git에 없다) — 타입체크·테스트·빌드가 그걸 읽는다.
      - run: pnpm install --frozen-lockfile

      # 마이그레이션 파일(apps/server/prisma/migrations)을 테스트 DB에 적용한다. 스키마와 마이그레이션이 어긋나면 여기서 실패한다.
      - run: pnpm --filter @qrate/server db:deploy

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # 브라우저 E2E(packages/widget/e2e): 방금 빌드한 서버 dist·위젯 dist로 목업 서버와 데모 페이지를 띄워
      # Chromium에서 런처·대화창 iframe·postMessage·CSP를 확인한다. 하나의 verify 잡에 두어 보호 규칙의 필수 체크에 그대로 포함된다.
      # Chromium은 매번 받는다 — 캐시 키를 관리하는 것보다 단순하고, 이 저장소의 실행 빈도에선 충분하다.
      - run: pnpm --filter @qrate/widget exec playwright install --with-deps chromium
      - run: pnpm e2e

      # 실패한 테스트의 트레이스. `pnpm --filter @qrate/widget exec playwright show-trace <trace.zip>`으로 재생한다.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: packages/widget/test-results/
          if-no-files-found: ignore
          retention-days: 7
