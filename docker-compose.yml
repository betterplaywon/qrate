# 로컬 개발·데모용 구성: PostgreSQL + API 서버.
#   docker compose up --build
# DB만 띄우고 서버는 pnpm dev로 돌리는 조합도 가능:
#   docker compose up db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrate
      POSTGRES_PASSWORD: qrate # 로컬 전용. 운영에선 시크릿 관리로 대체(면접 질문 소재)
      POSTGRES_DB: qrate
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrate"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 8787
      QRATE_PUBLIC_ORIGIN: ${QRATE_PUBLIC_ORIGIN:-http://localhost:8787} # 브라우저가 보는 서버 주소. 대화 API Origin 검사 기준
      DATABASE_URL: postgresql://qrate:qrate@db:5432/qrate
      SENTRY_DSN: ${SENTRY_DSN:-} # 셸 환경변수 또는 레포 루트 .env에서 읽음. 없으면 빈 값 → Sentry 비활성
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # 없으면 목업 엔진. 모델 설정(QRATE_*)은 코드 기본값을 쓴다
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
