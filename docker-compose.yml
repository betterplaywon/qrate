# 로컬 개발·데모용 구성: PostgreSQL + 마이그레이션·시드 + API 서버(위젯 대화창·운영 콘솔 /console/ 포함).
#   QRATE_DEMO_CONSOLE_KEY=<콘솔 키> docker compose up --build   # db → migrate(마이그레이션·시드 적용 뒤 종료) → server
# DB만 띄우고 서버는 pnpm dev로 돌리는 조합(평소 개발):
#   docker compose up -d db
#   pnpm --filter @qrate/server db:migrate   # 스키마 반영(prisma migrate dev), 처음엔 db:seed도
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrate
      POSTGRES_PASSWORD: qrate # 로컬 전용. 운영에선 시크릿 관리로 대체(면접 질문 소재)
      POSTGRES_DB: qrate
    # 이 컴퓨터에서만 연다. 주소를 빼면 Docker가 모든 네트워크 인터페이스에 열어, 같은 와이파이의 기기가
    # 공개 레포에 적힌 비밀번호(qrate, 슈퍼유저)로 접속할 수 있다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # 볼륨을 처음 만들 때만 실행된다 — 저장소 계약 테스트용 qrate_test DB 생성
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 마이그레이션 적용 + 시드. 서버 이미지의 빌드 스테이지(Prisma CLI·스키마 엔진·마이그레이션 파일이 있는 곳)를 그대로 쓴다 —
  # 런타임 이미지에는 CLI가 없다(실행에 필요 없고 이미지를 키운다). 끝나면 종료하고, 서버는 그 뒤에 뜬다.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://qrate:qrate@db:5432/qrate
      QRATE_DEMO_CONSOLE_KEY: ${QRATE_DEMO_CONSOLE_KEY:-} # 콘솔 로그인 키(해시만 저장). 비우면 시드가 키를 바꾸지 않는다 → 콘솔 로그인 불가
    command: ["sh", "-c", "pnpm --filter @qrate/server db:deploy && pnpm --filter @qrate/server db:seed"]
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 8787
      QRATE_PUBLIC_ORIGIN: ${QRATE_PUBLIC_ORIGIN:-http://localhost:8787} # 브라우저가 보는 서버 주소. 대화 API Origin 검사 기준
      DATABASE_URL: postgresql://qrate:qrate@db:5432/qrate
      SENTRY_DSN: ${SENTRY_DSN:-} # 셸 환경변수 또는 레포 루트 .env에서 읽음. 없으면 빈 값 → Sentry 비활성
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # 없으면 목업 엔진. 모델 설정(QRATE_*)은 코드 기본값을 쓴다
      QRATE_CONSOLE_SECRET: ${QRATE_CONSOLE_SECRET:-} # 콘솔 세션 서명 비밀(16자 이상). 비우면 컨테이너마다 무작위 → 재시작하면 다시 로그인
    ports:
      - "127.0.0.1:8787:8787" # db와 같은 이유. 실제 API 키를 받은 서버를 이 컴퓨터에서만 연다
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
